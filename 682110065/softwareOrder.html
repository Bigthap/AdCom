<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Save The World: Order Form</title>
    <link rel="stylesheet" href="main3.css">
</head>

<body>

    <div class="hero">

        <h1>Save The World: Order Form</h1>

        <p class="description">To order Save The World, please complete the following order form:</p>

        <div class="form-wrapper">
            <form action="#" method="post">
                <div class="form-row">
                    <label for="os">Choose your operating system:</label>
                    <select id="os" name="os">
                        <option value="windows">Windows</option>
                        <option value="linux">Linux</option>
                        <option value="macintosh">Macintosh</option>
                    </select>
                </div>

                <div class="form-row">
                    <label for="copies">Number of copies:</label>
                    <input type="text" id="copies" name="copies">
                </div>

                <div class="button-row">
                    <input type="submit" value="Submit Your Order">
                    <input type="reset" value="Reset">
                </div>
            </form>
        </div>
    </div>

</body>

</html>
