<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recipe World - Suggest a Recipe</title>
    <link rel="stylesheet" href="main.css">
</head>

<body>

    <div class="form-container">
        <h2>Suggest a recipe</h2>

        <form action="#" method="post">
            <div class="form-group">
                <label for="recipe-name">Recipe name</label>
                <input type="text" id="recipe-name" name="recipe-name">
            </div>

            <div class="form-group">
                <label for="ingredients">Ingredients</label>
                <textarea id="ingredients" name="ingredients"></textarea>
            </div>

            <div class="form-group">
                <label for="your-name">Your name</label>
                <input type="text" id="your-name" name="your-name">
            </div>

            <div class="form-group">
                <label for="your-email">Your email</label>
                <input type="email" id="your-email" name="your-email">
            </div>

            <div class="checkbox-group">
                <label for="newsletter">Get newsletter?</label>
                <input type="checkbox" id="newsletter" name="newsletter">
            </div>

            <button type="submit">Submit the recipe</button>
        </form>
    </div>

</body>

</html>
