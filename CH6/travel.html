<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Save The World: Order Form</title>
    <link rel="stylesheet" href="main2.css">
</head>

<body>

    <h1>Tralvel Reservation Form</h1>

    <div class="form-wrapper">
        <form action="travel.php" method="post">
            <div class="form-row">
                <label for="city">Select your vacation destination:</label>
                <select id="city" name="city">
                    <option value="Barcelona">Barcelona</option>
                    <option value="Cairo">Cairo</option>
                    <option value="Rome">Rome</option>
                    <option value="Santiago">Santiago</option>
                    <option value="Tokyo">Tokyo</option>
                </select>
            </div>
            <div class="form-row">
                <label for="copies">How many people are traveling?:</label>
                <input type="text" id="copies" name="people">
            </div>
            <div class="form-row">
                <label for="copies">How many nights will you be staying?:</label>
                <input type="text" id="copies" name="nights">
            </div>

            <div class="button-row">
                <input type="submit" value="Submit Your Reservation">
            </div>
        </form>
    </div>

</body>
